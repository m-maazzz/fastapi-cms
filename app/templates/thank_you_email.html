<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
            color: #444444;
        }
        .email-container {
            max-width: 600px;
            background-color: #ffffff;
            margin: 0 auto;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 0.03em;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 15px 0;
        }
        blockquote {
            background-color: #f0f4f8;
            border-left: 6px solid #3498db;
            margin: 20px 0;
            padding: 15px 20px;
            font-style: italic;
            color: #555555;
            border-radius: 4px;
        }
        strong {
            color: #2c3e50;
        }
        .signature {
            margin-top: 30px;
            font-size: 16px;
            color: #666666;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <h2>Thank you, {{ name }}!</h2>
        <p>We have received your message:</p>
        <blockquote>{{ message }}</blockquote>
        <p>We'll get back to you at <strong>{{ email }}</strong> shortly.</p>
        <p class="signature">Best regards,<br>Team</p>
    </div>
</body>
</html>
